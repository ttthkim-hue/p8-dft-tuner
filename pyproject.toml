[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "p8-dft-tuner"
version = "1.1.0"
description = "Portable hardware-topology, concurrency-slot, OpenMP-guard, MLIP manifold guard, and Blackwell Ozaki advisor for heterogeneous CPU-GPU Quantum ESPRESSO workloads"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Tae-Hyung Kim", email = "ttthkim@gmail.com" },
  { name = "Jin-Kyeom Kim", email = "jingyeom0825@kmou.ac.kr" }
]

[project.urls]
Homepage = "https://github.com/ttthkim-hue/p8-dft-tuner"
Repository = "https://github.com/ttthkim-hue/p8-dft-tuner"
Issues = "https://github.com/ttthkim-hue/p8-dft-tuner/issues"
keywords = [
  "quantum-espresso",
  "dft",
  "blackwell",
  "cuda",
  "ozaki-scheme",
  "mlip",
  "threadripper",
  "heterogeneous-computing",
  "openmp"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Chemistry"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
p8-dft-tuner = "p8_dft_tuner.cli:main"

[tool.setuptools.packages.find]
include = ["p8_dft_tuner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
